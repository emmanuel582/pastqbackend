# PastQ API behind Nginx. setup-vps.sh replaces __API_DOMAIN__ and certbot adds TLS.
limit_req_zone $binary_remote_addr zone=pastq_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=pastq_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # PDFs up to VISION_MAX_PDF_BYTES (200 MB) plus multipart overhead.
    client_max_body_size 210m;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    location / {
        limit_req zone=pastq_api burst=80 nodelay;
        limit_conn pastq_conn 40;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large uploads straight to the API instead of spooling them twice.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
